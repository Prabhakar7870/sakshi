<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakshi</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600&family=Khand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030c;--c1:#ff3d9a;--c2:#7b5cff;--tx:#f3eefc;--mu:#a79bc9;--warn:#ffb44a;--pl:#150b2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
body{position:relative;overflow:hidden;color:var(--tx);font:400 15px/1.4 "Exo 2",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 32%,#22104a 0,#0c0620 55%,var(--bg) 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none}
.top>*{pointer-events:auto}
.nm{font-weight:600;font-size:20px;letter-spacing:.06em}
#st{color:var(--c1);font-size:13px;transition:color .6s}
.rt{text-align:right;color:var(--mu);font-size:13px}
#mute{background:none;border:0;color:var(--mu);font:inherit;cursor:pointer;padding:4px 0}
#low{position:absolute;left:0;right:0;bottom:0;pointer-events:none;max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
#low>*{pointer-events:auto}
#me{text-align:center;color:var(--mu);font:400 16px/1.3 Khand,sans-serif;min-height:1.3em;padding:0 22px}
#out{text-align:center;font:500 clamp(20px,5.4vw,26px)/1.35 Khand,sans-serif;min-height:4.1em;padding:2px 22px 8px;text-shadow:0 0 24px rgba(123,92,255,.6)}
.dk{display:flex;gap:8px;justify-content:center;padding:0 16px 10px}
.dk button{font:inherit;font-size:14px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 16px;min-height:38px;cursor:pointer}
.dk button:hover{border-color:var(--c1)}
form{display:flex;gap:6px;align-items:center;margin:0 16px 14px;padding:5px 5px 5px 18px;border:1.5px solid transparent;border-radius:999px;background:linear-gradient(var(--pl),var(--pl)) padding-box,linear-gradient(90deg,var(--c1),var(--c2)) border-box}
input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--tx);background:transparent;border:0;outline:0;padding:8px 0}
input::placeholder{color:var(--mu)}
form button{font:inherit;font-size:14px;color:var(--tx);border:0;border-radius:999px;min-height:40px;padding:0 16px;cursor:pointer;background:rgba(255,255,255,.08)}
#mic.on{background:linear-gradient(90deg,var(--c1),var(--c2))}
#act{display:none;position:absolute;left:16px;right:16px;bottom:128px;max-width:560px;margin:0 auto;z-index:4;padding:14px;border:1px solid var(--warn);border-radius:16px;background:rgba(21,11,42,.94);backdrop-filter:blur(10px)}
#act b{display:block;color:var(--warn);font-weight:600;margin-bottom:6px}
#act textarea{width:100%;min-height:92px;font:500 17px/1.4 Khand,sans-serif;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{font:inherit;font-size:14px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--warn);background:transparent;color:var(--warn);cursor:pointer}
.row button.p{background:var(--warn);color:#2a1700}
#sc{display:none;position:absolute;inset:0;z-index:5;background:rgba(5,3,12,.55)}
#sh{position:absolute;left:0;right:0;bottom:0;z-index:6;max-width:640px;margin:0 auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;border-top:1.5px solid var(--c2);background:rgba(21,11,42,.93);backdrop-filter:blur(14px);transform:translateY(105%);transition:transform .35s ease}
#sh.open{transform:none}
#sh h2{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--c1)}
#sh .rw{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);color:var(--tx);font:inherit;font-size:16px;padding:10px 0}
#sh button.rw{cursor:pointer}#sh button.rw:hover{color:var(--c1)}
#sh .rw span+span{color:var(--mu)}#sh .rw span.off{color:var(--warn)}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
#boot{position:fixed;inset:0;z-index:9;background:var(--bg);border:0;color:var(--mu);font:inherit;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .8s}
#boot big{font-size:60px;font-weight:300;letter-spacing:.28em;color:var(--tx);margin-right:-.28em}
#boot.go{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body data-s="idle">
<button id="boot" type="button"><big>SAKSHI</big><span id="bt">Tap to wake</span></button>
<canvas id="cv" aria-label="Sakshi. Tap to speak."></canvas>
<div class="top"><div><div class="nm">Sakshi</div><div id="st">Ready</div></div><div class="rt"><div id="clk"></div><button id="mute" type="button">Voice on</button></div></div>
<div id="act"><b>Authorization required</b><textarea id="tx"></textarea><div class="row"><button class="p" id="ok" type="button">Authorize</button><button id="no" type="button">Cancel</button></div></div>
<div id="sc"></div><div id="sh"></div>
<div id="low"><div id="me"></div><div id="out" aria-live="polite"></div>
<div class="dk" id="dk"></div>
<form id="f"><input id="in" placeholder="Give a command" autocomplete="off"><button id="mic" type="button" hidden>Speak</button><button type="submit">Send</button></form></div>
<script>
const $=s=>document.querySelector(s),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const DATA={sch:[],mail:[],sys:[]};
const SH={Schedule:{rows:DATA.sch,fn:r=>"Tell me about this: "+r[0]+" "+r[1]},Inbox:{rows:DATA.mail,fn:r=>"Draft a reply to the email from "+r[0]},Systems:{rows:DATA.sys}};
const hx=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));
const MOODS={soft:["#ff3d9a","#7b5cff"],playful:["#ffb44a","#ff3d6e"],serious:["#9fd6ff","#4d6bff"]};
const STL={idle:"Ready",listen:"Listening",think:"Analyzing",speak:"Speaking"};
const SP={idle:[.06,.003,1],listen:[.3,.007,1.05],think:[.12,.045,.78],speak:[.3,.01,1]};
let pend=null,sample=null,dict=null,busy=false,mute=false,hist=[],tw,cur=null;
let C=[hx("#ff3d9a"),hx("#7b5cff")],TC=C.map(a=>a.slice()),tA=.06,tS=.003,tR=1,amp=0,spd=.003,rad=1,ang=0,T0=0;
// particle sphere + orbit ring
const cv=$("#cv"),g=cv.getContext("2d");let W,H,D;
function rs(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener("resize",rs);rs();
const S=[],Q=[];
for(let i=0;i<950;i++){const y=1-2*(i+.5)/950,r=Math.sqrt(1-y*y),a=i*2.39996;S.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()*6.28])}
for(let i=0;i<220;i++){const a=i/220*6.2832;Q.push([Math.cos(a)*1.48,(Math.random()-.5)*.05,Math.sin(a)*1.48,a])}
function draw(A,rot,tilt,ring,R,cx,cy,sz){
  const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(tilt),sn=Math.sin(tilt);
  for(const p of A){
    const d=ring?1:1+amp*Math.sin(T0*.004+p[3]*3+p[1]*4)*.5;
    const x=p[0]*d*rad,y=p[1]*d*rad,z=p[2]*d*rad;
    const x1=x*cr+z*sr,z1=-x*sr+z*cr,y1=y*ct-z1*sn,z2=y*sn+z1*ct;
    const f=3/(3-z2),u=(z2+1.6)/3.2,m=ring?(Math.sin(p[3]*3)+1)/2:(p[1]+1)/2;
    const c=[0,1,2].map(j=>(C[0][j]+(C[1][j]-C[0][j])*m)|0),s=sz*f*(.5+u);
    g.fillStyle="rgba("+c+","+(ring?.35+.5*u:.2+.7*u)+")";
    g.fillRect(cx+x1*R*f-s/2,cy+y1*R*f-s/2,s,s);
  }
}
function frame(t){
  T0=t;g.clearRect(0,0,W,H);
  const R=Math.min(W,H*.62)*.3,cx=W/2,cy=H*.35,sp=document.body.dataset.s==="speak";
  const ta=sp?.18+.34*Math.abs(Math.sin(t*.011)*Math.sin(t*.0037)):tA;
  for(let k=0;k<2;k++)for(let j=0;j<3;j++)C[k][j]+=(TC[k][j]-C[k][j])*.04;
  if(!RM){spd+=(tS-spd)*.05;ang+=spd;amp+=(ta-amp)*.06;rad+=(tR-rad)*.05}
  const gr=g.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.9);
  gr.addColorStop(0,"rgba("+C[0].map(Math.round)+","+(.16+amp*.25)+")");gr.addColorStop(1,"rgba("+C[1].map(Math.round)+",0)");
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  draw(S,ang,.32,0,R,cx,cy,1.9);draw(Q,-ang*1.7,1.12,1,R*.95,cx,cy,1.6);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function setMood(m){const a=MOODS[m]||MOODS.soft;TC=[hx(a[0]),hx(a[1])];document.body.style.setProperty("--c1",a[0]);document.body.style.setProperty("--c2",a[1])}
function st(s){document.body.dataset.s=s;$("#st").textContent=STL[s];[tA,tS,tR]=SP[s]}
// sheets
function closeSh(){cur=null;$("#sh").classList.remove("open");$("#sc").style.display="none"}
function sheet(k){if(cur===k){closeSh();return}cur=k;const d=SH[k],s=$("#sh");s.innerHTML="";const h=document.createElement("h2");h.textContent=k;s.append(h);
  d.rows.forEach(r=>{const e=document.createElement(d.fn?"button":"div");e.className="rw";if(d.fn)e.type="button";const a=document.createElement("span"),b=document.createElement("span");a.textContent=r[0];b.textContent=r[1];if(!d.fn&&!/^(Connected|Allowed|Bot on)$/.test(r[1]))b.className="off";e.append(a,b);if(d.fn)e.onclick=()=>{closeSh();send(d.fn(r))};s.append(e)});
  if(!d.rows.length){const e=document.createElement("div");e.className="rw";e.textContent="Nothing here yet.";s.append(e)}s.classList.add("open");$("#sc").style.display="block"}
Object.keys(SH).forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=k;b.onclick=()=>sheet(k);$("#dk").append(b)});
$("#sc").onclick=closeSh;addEventListener("keydown",e=>{if(e.key==="Escape")closeSh()});
function clk(){$("#clk").textContent=new Date().toLocaleString("en-IN",{weekday:"short",hour:"2-digit",minute:"2-digit"})}clk();setInterval(clk,30000);
function show(t){clearInterval(tw);const o=$("#out");o.textContent="";if(RM){o.textContent=t;return}
  const q=Intl.Segmenter?[...new Intl.Segmenter("hi",{granularity:"grapheme"}).segment(t)].map(x=>x.segment):Array.from(t);let i=0;tw=setInterval(()=>{o.textContent=q.slice(0,++i).join("");if(i>=q.length)clearInterval(tw)},24)}
function say(t){if(mute||!window.speechSynthesis){st("speak");setTimeout(()=>{if(document.body.dataset.s==="speak")st("idle")},Math.min(t.length*45,6000));return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),hi=/[\u0900-\u097F]/.test(t);u.lang=hi?"hi-IN":"en-IN";const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(hi?"hi":"en"));if(v)u.voice=v;u.onstart=()=>st("speak");u.onend=u.onerror=()=>{if(document.body.dataset.s==="speak")st("idle")};speechSynthesis.speak(u)}catch(e){st("idle")}}
async function send(t){t=t.trim();if(!t||busy)return;
  if(!sample){show("Couldn’t reach Claude. Reload the page.");return}
  busy=true;$("#in").value="";$("#me").textContent="You: "+t;$("#act").style.display="none";if(pend){api("/api/cancel",{id:pend}).catch(()=>{});pend=null}st("think");show("…");
  try{const r=await api("/api/chat",{text:t});
    const rp=String(r.reply||"");setMood(r.mood);show(rp);say(rp);notify(rp);hist.push([1,t],[0,rp]);
    if(r.action&&r.action.type){const a=r.action;pend=r.pendingId;$("#act b").textContent="Authorization required: "+a.type+(a.to?" → "+a.to:"")+(a.when?" ("+a.when+")":"");$("#tx").value=(a.subject?a.subject+"\n\n":"")+(a.body||"");$("#act").style.display="block"}}
  catch(e){st("idle");show(e&&e.message?e.message:"Couldn’t get a reply. Try again.")}
  busy=false}
$("#f").onsubmit=e=>{e.preventDefault();send($("#in").value)};
$("#mute").onclick=e=>{mute=!mute;e.target.textContent="Voice "+(mute?"off":"on");if(mute&&window.speechSynthesis)speechSynthesis.cancel()};
$("#ok").onclick=async()=>{$("#act").style.display="none";if(!pend)return;st("think");let m;try{m=(await api("/api/confirm",{id:pend,edit:$("#tx").value})).reply}catch(e){m=e.message}pend=null;show(m);say(m)};
$("#no").onclick=async()=>{$("#act").style.display="none";if(pend)api("/api/cancel",{id:pend}).catch(()=>{});pend=null;const m="रद्द कर दिया सर।";show(m);say(m)};
$("#boot").onclick=()=>{$("#boot").classList.add("go");send("Give me my morning briefing")};
const api=async(p,b,again)=>{
  const r=await fetch(p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
  if(r.status===401&&p!=="/api/login"&&!again&&await login())return api(p,b,1);
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j};
async function login(){for(let i=0;i<3;i++){const t=prompt("Access code");if(!t)return false;try{await api("/api/login",{token:t});return true}catch(e){alert(e.message)}}return false}
sample=true;
// ---- permissions: microphone, notifications, storage ----
const PERM={};
async function askPermissions(){
  try{const m=await navigator.mediaDevices.getUserMedia({audio:true});m.getTracks().forEach(t=>t.stop());PERM.Microphone="Allowed"}
  catch(e){PERM.Microphone=e&&e.name==="NotAllowedError"?"Blocked":"Unavailable"}
  try{PERM.Notifications="Notification" in window?({granted:"Allowed",denied:"Blocked"}[await Notification.requestPermission()]||"Not asked"):"Unavailable"}
  catch(e){PERM.Notifications="Unavailable"}
  try{PERM.Storage=navigator.storage&&navigator.storage.persist?(await navigator.storage.persist()?"Allowed":"Not granted"):"Unavailable"}
  catch(e){PERM.Storage="Unavailable"}
}
async function refresh(){
  const s=await api("/api/status"),g=s.google?"Connected":"Not connected";
  DATA.sys.length=0;
  DATA.sys.push(["Gmail",g],["Calendar",g],["Telegram",s.telegram?"Bot on":"Off"],["Microphone",PERM.Microphone||"Not asked"],["Notifications",PERM.Notifications||"Not asked"]);
  return s}
async function overview(){
  const o=await api("/api/overview");
  DATA.sch.length=0;DATA.sch.push(...o.schedule);DATA.mail.length=0;DATA.mail.push(...o.mail)}
// ---- voice input (browser speech recognition, Hindi) ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function listen(){
  if(!SR){$("#in").focus();return}
  if(document.body.dataset.s==="listen"){rec&&rec.stop();return}
  if(window.speechSynthesis)speechSynthesis.cancel();
  rec=new SR();rec.lang="hi-IN";rec.interimResults=true;rec.continuous=false;let sent=false;
  rec.onstart=()=>{st("listen");$("#mic").classList.add("on")};
  rec.onresult=e=>{let f="",i="";for(const r of e.results){if(r.isFinal)f+=r[0].transcript;else i+=r[0].transcript}
    $("#me").textContent="You: "+(f||i);if(f&&!sent){sent=true;send(f)}};
  rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed")show("Microphone is blocked. Allow it in the browser’s site settings.");else if(ev.error==="network")show("Voice recognition needs an internet connection.")};
  rec.onend=()=>{$("#mic").classList.remove("on");if(document.body.dataset.s==="listen")st("idle")};
  try{rec.start()}catch(e){}
}
$("#mic").hidden=!SR;$("#mic").onclick=listen;cv.onclick=listen;
// ---- wake-up: permissions, then login, then Google, then briefing ----
function notify(t){try{if(document.hidden&&window.Notification&&Notification.permission==="granted")new Notification("Sakshi",{body:t})}catch(e){}}
function fail(m){$("#bt").textContent=m+" Tap to retry.";$("#boot").classList.remove("go")}
$("#boot").onclick=async()=>{
  $("#boot").classList.add("go");
  const bad=location.search.includes("authed=0");
  if(location.search)history.replaceState(null,"","/");
  await askPermissions();
  try{
    let s=await refresh();
    if(!s.authed){if(!await login())return fail("Access code needed.");s=await refresh()}
    if(!s.google){if(bad)return fail("Google login failed.");location.href="/auth/google";return}
  }catch(e){return fail(e.message)}
  try{await overview()}catch(e){}
  send("Give me my morning briefing");
};
</script></body></html>
